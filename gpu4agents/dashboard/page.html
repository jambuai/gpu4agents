<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gpu dashboard</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a313c;
    --fg:#e6edf3; --dim:#8b96a5; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
    --accent:#58a6ff;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f8fa; --panel:#fff; --panel2:#f0f3f6; --line:#d8dee4;
      --fg:#1f2328; --dim:#6b7684; --accent:#0969da;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  .pill{font-size:12px;color:var(--dim)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;
    vertical-align:middle;background:var(--dim)}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
  main{padding:16px;max-width:1100px;margin:0 auto}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
    margin:22px 0 10px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card .top{display:flex;justify-content:space-between;align-items:start;gap:8px}
  .name{font-weight:600}
  .model{font-size:12px;color:var(--dim);word-break:break-all;margin-top:2px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
    white-space:nowrap}
  .badge.ok{color:var(--ok);border-color:#1f5f2e} .badge.bad{color:var(--bad);border-color:#5f2220}
  .badge.warn{color:var(--warn);border-color:#5f4a12} .badge.dim{color:var(--dim)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:10px;font-size:13px}
  .kv .k{color:var(--dim)} .kv .v{text-align:right;font-variant-numeric:tabular-nums}
  .spark{display:flex;gap:2px;margin-top:10px;height:20px;align-items:flex-end}
  .spark i{flex:1;min-width:2px;background:var(--ok);border-radius:1px;opacity:.85}
  .spark i.bad{background:var(--bad)} .spark i.none{background:var(--line)}
  .empty{color:var(--dim);font-size:13px;padding:10px 0}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .actions button{font:12px inherit;cursor:pointer;background:var(--panel2);
    color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
  .actions button:hover{border-color:var(--accent)}
  .actions button.danger{color:var(--bad);border-color:#5f2220}
  .err{color:var(--bad);font-size:12px;margin-top:8px}
  footer{color:var(--dim);font-size:12px;padding:8px 16px;text-align:center}
  a{color:var(--accent)}
  #rentbtn{font:13px inherit;cursor:pointer;background:var(--accent);color:#fff;
    border:none;border-radius:6px;padding:5px 12px;font-weight:600}
  .unverified{opacity:.55}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;
    align-items:center;justify-content:center;padding:16px}
  #overlay.on{display:flex}
  #panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    max-width:760px;width:100%;max-height:85vh;overflow:auto;padding:18px;position:relative}
  #panel h3{margin:0 0 12px} #closepanel{position:absolute;top:10px;right:12px;
    background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
  #panel pre{white-space:pre-wrap;word-break:break-word;font-size:12px;
    background:var(--bg);padding:10px;border-radius:6px;max-height:60vh;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--dim);font-weight:500}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>gpu dashboard</h1>
  <span class="pill" id="status"><span class="dot"></span>connecting…</span>
  <button id="rentbtn" style="display:none">+ rent a GPU</button>
  <span class="pill" style="margin-left:auto" id="clock"></span>
</header>
<main>
  <h2>GPUs</h2>
  <div class="grid" id="gpus"></div>
  <h2>Proxies &amp; services</h2>
  <div class="grid" id="proxies"></div>
</main>
<div id="overlay"><div id="panel"><button id="closepanel">✕</button>
  <h3 id="panel-title"></h3><div id="panel-body"></div></div></div>
<footer><span id="mode">read-only</span> · <span id="count"></span></footer>

<script>
"use strict";
var REFRESH_MS = 5000;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function fmtIdle(sec){
  if(sec==null) return "—";
  sec=Math.max(0,Math.floor(sec));
  if(sec<60) return sec+"s";
  var m=Math.floor(sec/60); if(m<60) return m+"m";
  var h=Math.floor(m/60); return h+"h"+(m%60)+"m";
}
function fmtUsd(n){ return n==null?"—":"$"+Number(n).toFixed(3); }

function reach(row, probes){
  var ep = row.endpoint;
  if(!ep) return {cls:"dim", label:"no endpoint"};
  var p = probes && probes[ep];
  if(!p || p.last_ok==null) return {cls:"dim", label:"probing…", p:p};
  if(p.last_ok) return {cls:"ok", label:"reachable", p:p};
  var e110 = p.errno110_in_window>0;
  return {cls: e110?"warn":"bad", label: e110?"timeouts":"unreachable", p:p};
}

function spark(p){
  if(!p || !p.window || !p.window.length) return "";
  var w = p.window.slice(-40);
  return '<div class="spark">'+w.map(function(x){
    return '<i class="'+(x.ok?"":"bad")+'"></i>'; }).join("")+'</div>';
}

var CONTROL = false;
var CONTROLLABLE = [];

function actionBar(row, kinds){
  // Buttons appear only in control mode and only for a project this host can
  // resolve. Values go in data-* attributes (HTML-escaped), never a JS string.
  if(!CONTROL || !row.project || CONTROLLABLE.indexOf(row.project) < 0) return "";
  return '<div class="actions">'+kinds.map(function(a){
    var danger = (a==="destroy"||a==="stop") ? "danger" : "";
    return '<button class="'+danger+'" data-action="'+esc(a)+'" data-project="'+
      esc(row.project)+'">'+esc(a)+'</button>';
  }).join("")+'</div>';
}

function gpuCard(row, probes){
  if(row.error){
    return '<div class="card"><div class="top"><div><div class="name">'+esc(row.project)+
      '</div><div class="model">'+esc(row.dir)+'</div></div>'+
      '<span class="badge bad">state unknown</span></div>'+
      '<div class="err">'+esc(row.error)+'</div></div>';
  }
  var r = reach(row, probes);
  var cls = row.verified===false ? "card unverified" : "card";
  return '<div class="'+cls+'"><div class="top"><div>'+
    '<div class="name">'+esc(row.project)+'</div>'+
    '<div class="model">'+esc(row.model||"—")+'</div></div>'+
    '<span class="badge '+r.cls+'">'+esc(r.label)+'</span></div>'+
    '<div class="kv">'+
      '<span class="k">state</span><span class="v">'+esc(row.state||"—")+'</span>'+
      '<span class="k">endpoint</span><span class="v">'+esc(row.endpoint||"—")+'</span>'+
      '<span class="k">$/h</span><span class="v">'+fmtUsd(row.hourly_cost_usd)+'</span>'+
      '<span class="k">session</span><span class="v">'+fmtUsd(row.session_cost_usd)+'</span>'+
      '<span class="k">idle</span><span class="v">'+fmtIdle(row.idle_seconds)+'</span>'+
    '</div>'+ spark(r.p) + actionBar(row, ["logs","lock","stop","destroy"]) +'</div>';
}

// --- panel (logs / offers) ---
function openPanel(title, html){
  document.getElementById("panel-title").textContent = title;
  document.getElementById("panel-body").innerHTML = html;
  document.getElementById("overlay").classList.add("on");
}
function closePanel(){ document.getElementById("overlay").classList.remove("on"); }

function showLogs(project){
  openPanel("logs · "+project, "<pre>loading…</pre>");
  fetch("/api/logs?project="+encodeURIComponent(project))
    .then(function(r){ return r.text(); })
    .then(function(t){ document.getElementById("panel-body").innerHTML =
      "<pre>"+esc(t)+"</pre>"; })
    .catch(function(e){ document.getElementById("panel-body").innerHTML =
      "<pre>"+esc(String(e))+"</pre>"; });
}

function showOffers(){
  if(!CONTROLLABLE.length){ openPanel("rent a GPU", "<pre>no projects to rent into</pre>"); return; }
  var sel = '<p>rent into: <select id="rent-target">'+
    CONTROLLABLE.map(function(p){return '<option>'+esc(p)+'</option>';}).join("")+
    '</select> <span class="pill">offers match this project\'s requirements</span></p>';
  openPanel("rent a GPU", sel+'<div id="offers-box"><p>loading offers…</p></div>');
  loadOffersFor(CONTROLLABLE[0]);
}

function loadOffersFor(project){
  var box = document.getElementById("offers-box");
  if(box) box.innerHTML = "<p>loading offers for "+esc(project)+"…</p>";
  fetch("/api/offers?project="+encodeURIComponent(project)).then(function(r){ return r.json(); })
    .then(function(d){
      var box = document.getElementById("offers-box");
      if(!box) return;
      if(d.error){ box.innerHTML = "<pre>"+esc(d.error)+"</pre>"; return; }
      var offers = d.offers||[];
      if(!offers.length){ box.innerHTML = "<p>no offers match this project under its budget.</p>"; return; }
      var rows = offers.map(function(o){
        return '<tr><td>'+esc(o.gpu)+'</td><td class="num">'+esc(o.vram_gb)+'GB</td>'+
          '<td class="num">$'+Number(o.hourly_cost_usd).toFixed(3)+'/h</td>'+
          '<td>'+esc(o.region||"")+'</td>'+
          '<td><button data-rent="'+esc(o.id)+'">rent</button></td></tr>';
      }).join("");
      box.innerHTML = '<table><tr><th>GPU</th><th>VRAM</th><th>$/h</th><th>region</th><th></th></tr>'+rows+'</table>';
    }).catch(function(e){
      var box = document.getElementById("offers-box");
      if(box) box.innerHTML = "<pre>"+esc(String(e))+"</pre>";
    });
}

function rentOffer(offerId){
  var t = document.getElementById("rent-target");
  var project = t ? t.value : (CONTROLLABLE[0]||"");
  if(!project){ alert("no controllable project to rent into"); return; }
  if(!window.confirm("Rent offer "+offerId+" into \""+project+"\"? This spends money.")) return;
  openPanel("renting…", "<pre>provisioning offer "+esc(offerId)+" into "+esc(project)+
    " — this can take several minutes…</pre>");
  fetch("/api/control/rent", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({project:project, offer_id:offerId, confirm:true})})
    .then(function(r){ return r.json().then(function(b){return {ok:r.ok,b:b};}); })
    .then(function(x){ document.getElementById("panel-body").innerHTML =
      "<pre>"+esc(x.ok ? (x.b.result && x.b.result.output || "done") : (x.b.error||"failed"))+"</pre>"; tick(); })
    .catch(function(e){ document.getElementById("panel-body").innerHTML="<pre>"+esc(String(e))+"</pre>"; });
}

function doAction(action, project){
  if(action==="logs"){ showLogs(project); return; }
  var spend = (action==="destroy"||action==="stop") ? " This cannot be undone." : "";
  if(!window.confirm("Run \""+action+"\" on project \""+project+"\"?"+spend)) return;
  fetch("/api/control/"+encodeURIComponent(action), {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({project:project, confirm:true})
  }).then(function(r){ return r.json().then(function(b){ return {ok:r.ok, b:b}; }); })
    .then(function(x){
      if(!x.ok) alert(action+" failed: "+(x.b && x.b.error || "error"));
      tick();
    }).catch(function(e){ alert(String(e)); });
}

function proxyCard(row, probes){
  var r = reach(row, probes);
  return '<div class="card"><div class="top"><div>'+
    '<div class="name">'+esc(row.project||row.name||"proxy")+'</div>'+
    '<div class="model">'+esc(row.listen||row.endpoint||"")+'</div></div>'+
    '<span class="badge '+r.cls+'">'+esc(r.label)+'</span></div>'+
    (row.service!=null?'<div class="kv"><span class="k">service</span><span class="v">'+
      esc(row.service)+'</span></div>':'')+ spark(r.p) +
    actionBar(row, ["restart-proxy"]) +'</div>';
}

function setStatus(ok, msg){
  var el=document.getElementById("status");
  el.innerHTML='<span class="dot '+(ok?"ok":"bad")+'"></span>'+esc(msg);
}

function render(d){
  CONTROL = d.control===true;
  CONTROLLABLE = d.controllable||[];
  document.getElementById("rentbtn").style.display = CONTROL ? "inline-block" : "none";
  document.getElementById("mode").textContent = CONTROL ? "control enabled" : "read-only";
  var probes=d.probes||{};
  var gpus=d.instances||[];
  var gEl=document.getElementById("gpus");
  gEl.innerHTML = gpus.length ? gpus.map(function(r){return gpuCard(r,probes);}).join("")
    : '<div class="empty">No live GPUs.</div>';
  var px=d.proxies||[];
  var pEl=document.getElementById("proxies");
  pEl.innerHTML = px.length ? px.map(function(r){return proxyCard(r,probes);}).join("")
    : '<div class="empty">No proxies reported.</div>';
  document.getElementById("count").textContent =
    gpus.length+" GPU(s), "+px.length+" proxy(ies)";
  document.getElementById("clock").textContent =
    "updated "+new Date().toLocaleTimeString();
}

function tick(){
  fetch("/api/state",{headers:{"Accept":"application/json"}})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){ setStatus(true,"live"); render(d); })
    .catch(function(e){ setStatus(false,String(e.message||e)); });
}
document.addEventListener("click", function(ev){
  var t = ev.target;
  var a = t.closest && t.closest("button[data-action]");
  if(a){ doAction(a.getAttribute("data-action"), a.getAttribute("data-project")); return; }
  var rent = t.closest && t.closest("button[data-rent]");
  if(rent){ rentOffer(rent.getAttribute("data-rent")); return; }
  if(t.id==="rentbtn") showOffers();
  if(t.id==="closepanel" || t.id==="overlay") closePanel();
});
document.addEventListener("change", function(ev){
  if(ev.target.id==="rent-target") loadOffersFor(ev.target.value);
});
tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
