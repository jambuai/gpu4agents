# gpu.yaml - shared across Jambu.ai Lab sub-projects. This tool only reads
# the gpu_runtime: key below; add other tools' own top-level keys alongside
# it without conflict. Credentials never live here.
#
# This file shows every field in one place, for reference. Running more than
# one model? Don't copy this file per model - use `model_profile: <name>`
# with a shared gpu.models.yaml catalog instead. See
# docs/CHOOSING_A_MODEL.md and gpu.models.yaml in this repo for an example.
gpu_runtime:
  version: 1

  provider:
    name: vast
    profile: default
    # options:
    #   verified_only: true
    #   min_inet_down_mbps: 1000

  compute:
    gpu:
      min_vram_gb: 24
      count: 1
      # name_filter: RTX 4090
    disk_gb: 80
    # Machines to try when one fails to boot (bad network, stuck image pull).
    host_attempts: 3
    # Pin the image: its CUDA build sets the minimum host driver (cu129 = 12.9).
    # image: vllm/vllm-openai:v0.32.0

  model:
    id: empero-ai/Qwythos-9B-v2
    # revision: main
    hf_token_env: HF_TOKEN

  runtime:
    engine: vllm
    port: 8000
    context_length: 16384
    gpu_memory_utilization: 0.90
    # extra_args: ["--enable-prefix-caching"]

    # Agentic flows (tool calling on /v1/chat/completions and /v1/responses):
    # vLLM already implements both, this only picks the right --tool-call-parser.
    # auto guesses one from model.id; set explicitly if it can't.
    tool_calling: auto
    # tool_call_parser: hermes
    # tool_server: demo   # let vLLM execute MCP tools server-side

  lifecycle:
    max_lifetime: 6h
    idle_timeout: 15m
    # Destroy an instance left STOPPED this long (a stopped Vast instance
    # still bills storage). null keeps stopped instances forever.
    stopped_ttl: 24h

    auto_stop: true
    auto_destroy: false
    # Where a stopped instance still bills storage (Vast.ai), the guard
    # destroys it instead of stopping. true stops it (disk kept, restart in
    # about a minute) and leaves the removal to stopped_ttl.
    keep_disk: false

    # Requests served by vLLM count as activity (read from its /metrics).
    traffic_counts_as_activity: true

    cleanup_on_setup_failure: true
    allow_indefinite_lock: false

    heartbeat_interval: 30s
    heartbeat_grace: 5m

    lock:
      enabled: false
      default_ttl: 2h

    watchdog:
      enabled: true
      port: 8777
      interval: 60s

  health:
    interval: 60s
    boot_timeout: 30m
    pull_stall_timeout: 10m   # a pull with no progress this long: replace the host
    startup_timeout: 10m
    path: /health

  budget:
    max_hourly_cost_usd: 1.00
    max_session_cost_usd: 5.00

  workload:
    mode: local

  # Queue mode (optional): present = a pool of machines drains a job queue.
  # Addresses and credentials stay out of this file: GPU_QUEUE_URL, GPU_OUTPUTS_URL, AWS_*.
  # queue:
  #   backend: local            # local | redis | module:factory
  #   outputs: local            # local | s3 | module:factory
  #   min_machines: 0
  #   max_machines: 1
  #   max_usd_per_hour: 2.00
  #   scale_up_after: 30s
  #   jobs_per_machine: 1
  #   max_attempts: 3
  #   unresponsive_after: 5m
  #   max_machine_lifetime: 6h
  #   tick: 5s
  #   preflight: mypkg.checks:preflight
  #   health_check:
  #     command: null           # null = built-in CUDA check
  #     min_free_vram_gb: 16
  #     timeout: 2m
  #     between_jobs: true
  #   defaults:
  #     timeout: 1h
  #     max_cost_usd: 5.00
  #     deadline_margin: 10m
