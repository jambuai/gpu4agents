name: Feature request
description: A provider, a runtime, a tool for agents, or something else.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you or your agent trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
