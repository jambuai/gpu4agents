[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu4agents"
version = "0.5.0"
description = "GPU for Agents: your coding agent rents the GPU it needs, on its own. You pay only while it works."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gpu", "agents", "mcp", "claude-code", "cursor", "vllm", "llm", "vast-ai", "inference", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
authors = [
    { name = "Jambu.ai" },
    { name = "João Gabriel Lima", email = "joao.gabriel@jambu.ai" },
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "respx>=0.21.0"]

[project.urls]
Homepage = "https://gpu4agents.jambu.ai"
Documentation = "https://github.com/jambuai/gpu4agents/tree/main/docs"
Repository = "https://github.com/jambuai/gpu4agents"
Issues = "https://github.com/jambuai/gpu4agents/issues"
Changelog = "https://github.com/jambuai/gpu4agents/blob/main/CHANGELOG.md"
Author = "https://www.linkedin.com/in/joaogabriellima"

[project.scripts]
gpu = "gpu4agents.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["gpu4agents", "jambu_gpu"]

[tool.hatch.build.targets.sdist]
exclude = ["/.env", "/.venv", "/.gpu", "/.jambu", "/.wrangler", "/site", "/dist", "/uv.lock", "**/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
